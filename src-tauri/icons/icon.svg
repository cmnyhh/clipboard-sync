<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="50%" stop-color="#F7941D"/>
      <stop offset="100%" stop-color="#E8731A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.15)"/>
    </filter>
    <linearGradient id="paper" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f6f3"/>
    </linearGradient>
  </defs>

  <!-- 圆角背景 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 内部微光 -->
  <ellipse cx="160" cy="130" rx="200" ry="180" fill="rgba(255,255,255,0.18)"/>

  <!-- 信笺主体 -->
  <g filter="url(#shadow)">
    <!-- 纸张 -->
    <path d="
      M 165 145
      L 330 145
      L 345 160
      L 345 370
      L 165 370
      Z
    " fill="url(#paper)" stroke="rgba(245,166,35,0.1)" stroke-width="1"/>

    <!-- 折角 -->
    <path d="M 330 145 L 330 160 L 345 160 Z" fill="rgba(245,166,35,0.2)"/>
    <path d="M 330 145 L 345 160" fill="none" stroke="rgba(245,166,35,0.15)" stroke-width="1"/>
  </g>

  <!-- 文字线条 -->
  <line x1="195" y1="200" x2="270" y2="200" stroke="rgba(245,166,35,0.35)" stroke-width="8" stroke-linecap="round"/>
  <line x1="195" y1="235" x2="310" y2="235" stroke="rgba(245,166,35,0.30)" stroke-width="8" stroke-linecap="round"/>
  <line x1="195" y1="270" x2="280" y2="270" stroke="rgba(245,166,35,0.35)" stroke-width="8" stroke-linecap="round"/>
  <line x1="195" y1="305" x2="245" y2="305" stroke="rgba(245,166,35,0.25)" stroke-width="8" stroke-linecap="round"/>

  <!-- 飞行弧线箭头 -->
  <g transform="translate(320, 230)">
    <!-- 弧线 -->
    <path d="M -20 40 A 65 65 0 0 1 50 -30"
      fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="14" stroke-linecap="round"/>
    <!-- 箭头 -->
    <path d="M 42 -32 L 58 -22 M 42 -32 L 48 -48"
      fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 小圆点装饰 -->
  <circle cx="150" cy="380" r="6" fill="rgba(255,255,255,0.3)"/>
  <circle cx="365" cy="170" r="4" fill="rgba(255,255,255,0.25)"/>
</svg>
