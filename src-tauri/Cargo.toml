[package]
name = "clipboard-sync"
version = "0.2.0"
description = "跨平台剪贴板同步工具"
authors = ["Your Name"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.dev]
opt-level = 0
lto = false
codegen-units = 16

[profile.dev.package."*"]
opt-level = 2

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
local-ip-address = "0.6"
arboard = "3"
notify-rust = "4"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
hostname = "0.4"
base64 = "0.22"
rfd = "0.15"
open = "5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
