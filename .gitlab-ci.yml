stages:
  - build

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"

# macOS 构建
build-macos:
  stage: build
  tags:
    - macos
  script:
    - npm ci
    - npm run build
    - cd src-tauri && cargo tauri build
  artifacts:
    paths:
      - src-tauri/target/release/bundle/dmg/*.dmg
      - src-tauri/target/release/bundle/macos/*.app
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web"

# Linux 构建
build-linux:
  stage: build
  image: ubuntu:22.04
  before_script:
    - apt-get update
    - apt-get install -y curl wget gnupg build-essential pkg-config
    - apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
    - apt-get install -y libayatana-appindicator3-dev librsvg2-dev patchelf xclip
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - export PATH="$HOME/.cargo/bin:$PATH"
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs
  script:
    - export PATH="$HOME/.cargo/bin:$PATH"
    - npm ci
    - npm run build
    - cd src-tauri && cargo tauri build
  artifacts:
    paths:
      - src-tauri/target/release/bundle/deb/*.deb
      - src-tauri/target/release/bundle/appimage/*.AppImage
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web"

# Windows 构建
build-windows:
  stage: build
  tags:
    - windows
  script:
    - npm ci
    - npm run build
    - cd src-tauri && cargo tauri build
  artifacts:
    paths:
      - src-tauri/target/release/bundle/msi/*.msi
      - src-tauri/target/release/bundle/nsis/*.exe
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web"
